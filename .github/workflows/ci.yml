name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-never-use-in-deployment-123456789
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://app:test-password@localhost:5432/test' || 'sqlite:///./ci.db' }}
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://app:test-password@localhost:5432/test' || 'sqlite://' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: docker build -t fastapi-starter .
